name: Unshackled Ventures I
description: Unshackled Ventures is an inception-stage venture capital firm that writes
  the first check for founders before they have products, traction, or revenue, with a
  focus on immigrant and international founders. Beyond capital the firm provides an
  immigration platform that handles founder visas at no cost, a mentorship network of
  founders and operators, and a fundraising engine for follow-on rounds. It was surfaced
  in the API Evangelist network as a portfolio entry of 500 Global; it is a venture firm
  and publishes no public API or developer program.
